<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التسجيل · نادي مستهل</title>
<meta name="description" content="تسجيل الحضور في فعاليات نادي مستهل الطلابي">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#f6f4f0;--card:#ffffff;--ink:#241a14;--ink-2:#5a4a40;--brown:#4a1e10;--gold:#a8822f;--line:#e4ddd2;--ok:#2f5d3a;--bad:#9b2d1f;
--f-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;direction:rtl;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;max-width:720px;width:100%;margin:0 auto}
header img{height:40px;width:auto;display:block}
header a{color:var(--ink-2);text-decoration:none;font-size:14px}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:8px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);padding:28px 24px 24px}
.k{font-size:13px;letter-spacing:0;color:var(--gold);font-weight:600;margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,5vw,32px);line-height:1.3;margin:0;color:var(--brown);text-wrap:balance}
.lead{margin:8px 0 0;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:600}
form{margin-top:22px;display:flex;flex-direction:column;gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
input[type=text],input[type=tel]{font:inherit;font-size:16px;padding:12px 14px;border:1px solid #cfc5b8;background:#fff;color:var(--ink);border-radius:0;width:100%}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:600;font-size:15px;padding:0;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #cfc5b8;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--brown);background:#faf6f0}
.opt input{accent-color:var(--brown);width:18px;height:18px;margin:0}
.hp{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden}
button{font:inherit;font-family:var(--f-display);font-weight:700;font-size:18px;padding:14px 18px;background:var(--brown);color:#fff;border:0;cursor:pointer;margin-top:6px}
button:disabled{opacity:.6;cursor:default}
.msg{display:none;margin-top:16px;padding:14px 16px;border:1px solid var(--line);font-size:15px}
.msg.ok{display:block;border-color:#bfd3c4;background:#f1f7f2;color:var(--ok)}
.msg.bad{display:block;border-color:#e6c2bb;background:#fbf1ef;color:var(--bad)}
.done{display:none;text-align:center;padding:30px 10px 10px}
.done h2{font-family:var(--f-display);color:var(--brown);margin:0 0 8px;font-size:26px}
.done p{margin:0;color:var(--ink-2)}
footer{text-align:center;color:var(--ink-2);font-size:13px;padding:14px 20px 26px}
footer a{color:var(--brown);text-decoration:none}
</style>
</head>
<body>
<header>
  <img src="../img/logo.png" alt="نادي مستهل الطلابي">
  <a href="../">موقع النادي</a>
</header>
<main>
  <section class="card" id="card">
    <p class="k" id="kicker">نادي مستهل الطلابي يدعوكم لحضور</p>
    <h1 id="title">لقاء حواري</h1>
    <p class="lead" id="lead"></p>
    <div class="meta" id="meta"></div>

    <form id="f" novalidate>
      <label class="f">الاسم
        <input type="text" name="name" required minlength="3" maxlength="60" autocomplete="name" placeholder="الاسم الثلاثي">
      </label>
      <fieldset>
        <legend>تأكيد الحضور</legend>
        <label class="opt"><input type="radio" name="confirm" value="yes" required> <span>نعم، سأحضر</span></label>
        <label class="opt"><input type="radio" name="confirm" value="maybe"> <span>ربما أحضر</span></label>
      </fieldset>
      <div class="hp" aria-hidden="true"><label>اتركه فارغًا <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <button type="submit" id="btn">سجّل حضوري</button>
      <div class="msg" id="msg" role="status"></div>
    </form>

    <div class="done" id="done">
      <h2>تم تسجيلك</h2>
      <p id="doneText">نشوفك في اللقاء. إذا تغيّر شيء أعد التسجيل بنفس الاسم وسيُحدَّث تسجيلك.</p>
    </div>
  </section>
</main>
<footer>نادي مستهل الطلابي · المعهد الملكي للفنون التقليدية (وِرث) · <a href="https://instagram.com/mustahel_club" target="_blank" rel="noopener">@mustahel_club</a></footer>

<script src="../js/config.js"></script>
<script>
const EVENTS = {
  apple: {
    kicker: 'نادي مستهل الطلابي يدعوكم لحضور',
    title: 'لقاء حواري مع القيّمة الفنية روان القحطاني لمعرض «التفاحة المنفردة»',
    lead: 'جولة في الأعمال، ثم حوار مفتوح عن الطريق من الفكرة الأولى إلى صالة العرض',
    meta: [['اليوم','السبت 5 ديسمبر 2026'],['الوقت','8:00 مساءً'],['المكان','استوديو شعشعي، قاعة F05']],
  },
};
const q = new URLSearchParams(location.search); const key = (q.get('e')||'apple').replace(/[^\w\-]/g,'');
const ev = EVENTS[key] || EVENTS.apple; const evId = EVENTS[key] ? key : 'apple';
document.getElementById('kicker').textContent = ev.kicker; document.getElementById('title').textContent = ev.title; document.getElementById('lead').textContent = ev.lead;
document.getElementById('meta').innerHTML = ev.meta.map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join('');
document.title = 'التسجيل · ' + ev.title;

const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
const ERR = { name:'اكتب الاسم كاملًا', confirm:'اختر تأكيد الحضور', event:'رابط التسجيل غير صحيح', full:'اكتمل العدد، تواصل مع النادي', bad_json:'تعذّر الإرسال' };
function show(kind, text){ msg.className = 'msg ' + kind; msg.textContent = text; }
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  if (!d.name || d.name.trim().length < 3) return show('bad', ERR.name);
  if (!d.confirm) return show('bad', ERR.confirm);
  if (!window.MUSTAHAL_API) return show('bad', 'الخادم غير مربوط بعد');
  btn.disabled = true; show('', ''); msg.className='msg';
  try {
    const r = await fetch(window.MUSTAHAL_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'register', event:evId, name:d.name.trim(), confirm:d.confirm, hp:d.hp||'' }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error||'error');
    f.style.display = 'none'; document.getElementById('done').style.display = 'block';
    if (j.updated) document.getElementById('doneText').textContent = 'حدّثنا تسجيلك السابق بنفس الاسم. نشوفك في اللقاء.';
    try { localStorage.setItem('mustahal.rsvp.'+evId, '1'); } catch {}
  } catch (err) {
    show('bad', ERR[err.message] || 'تعذّر الإرسال، حاول مرة أخرى');
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
